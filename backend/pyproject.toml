[project]
name = "apex-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends() in defaults is the documented pattern.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
