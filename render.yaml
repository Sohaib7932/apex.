# Render Blueprint for the Apex API (Milestone 1).
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked
# `sync: false` are prompted for in the dashboard and never stored in git.
services:
  - type: web
    name: apex-api
    runtime: python
    rootDir: backend
    plan: free
    # Pick the Render region closest to your Neon project's region.
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Your Vercel URL, e.g. https://apex-xyz.vercel.app (comma-separate several).
      - key: CORS_ORIGINS
        sync: false
